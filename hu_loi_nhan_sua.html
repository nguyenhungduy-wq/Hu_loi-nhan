<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#f7dce9"><title>Hũ lời nhắn 🌷</title>
<style>
:root{--pink:#f6d9e6;--rose:#d985aa;--lav:#e8defa;--ink:#64546c;--paper:#fffaf2}
*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 15%,#fff8fd 0,transparent 35%),linear-gradient(145deg,#f9e8f1,#eee8ff 55%,#e8f4ff);display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden}
main{width:min(100%,460px);text-align:center;position:relative}.sparkle{position:fixed;pointer-events:none;opacity:.7;animation:float 7s ease-in-out infinite;font-size:20px}.s1{top:8%;left:8%}.s2{top:18%;right:8%;animation-delay:1s}.s3{bottom:10%;left:14%;animation-delay:2s}.s4{bottom:18%;right:12%;animation-delay:3s}
h1{font-size:clamp(28px,7vw,38px);margin:5px 0 6px;color:#986381;letter-spacing:.2px}.sub{margin:0 0 20px;font-size:15px;line-height:1.6;color:#88738e}
.jar-area{height:270px;display:flex;align-items:center;justify-content:center;position:relative;margin:8px auto 4px}.jar{position:relative;width:180px;height:208px;border:5px solid rgba(255,255,255,.8);border-radius:35px 35px 43px 43px;background:linear-gradient(110deg,rgba(255,255,255,.48),rgba(255,255,255,.15) 35%,rgba(255,255,255,.55));box-shadow:0 16px 28px #b58ba83b,inset 0 0 18px #fff8;cursor:pointer;transition:transform .25s}.jar:hover{transform:translateY(-4px) rotate(-2deg)}.lid{position:absolute;top:-20px;left:22px;width:126px;height:26px;border-radius:9px;background:linear-gradient(#d6b4d7,#b994c1);border:3px solid #fff9;box-shadow:0 5px 6px #997ba533}.jar:before{content:'';position:absolute;left:16px;top:12px;width:12px;height:150px;border-radius:12px;background:#ffffff62}.jar-label{position:absolute;top:65px;left:25px;right:25px;padding:13px 8px;background:#fff8;border-radius:18px;font-size:17px;font-weight:700;color:#a36e92;transform:rotate(-3deg)}.paper-stack{position:absolute;bottom:20px;left:25px;right:25px;height:35px;display:flex;justify-content:center;gap:5px}.paper-stack span{width:27px;height:32px;background:#fff4c8;border-radius:4px;transform:rotate(-8deg);box-shadow:0 3px 5px #9c7b5530}.paper-stack span:nth-child(2){background:#fce2ee;transform:rotate(5deg)}.paper-stack span:nth-child(3){background:#e6e0ff;transform:rotate(12deg)}
button{border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,#d98db2,#b99be1);box-shadow:0 8px 18px #b38bb74a;cursor:pointer;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.04);transform:translateY(-2px)}button:active{transform:scale(.97)}.secondary{background:#fff9;color:#9877a1;border:1px solid #fff;box-shadow:none}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0 4px}.note-card{min-height:136px;margin:17px auto 12px;width:min(100%,390px);padding:22px 20px;background:var(--paper);border-radius:22px;box-shadow:0 12px 28px #b8a0c333;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateY(12px) scale(.96);transition:opacity .35s,transform .35s}.note-card.show{opacity:1;transform:translateY(0) scale(1)}.note-text{font-size:19px;line-height:1.65;color:#826482;font-weight:600}.note-icon{font-size:26px;margin-bottom:8px}.hint{font-size:12px;color:#9b88a3;margin:13px 0 0}.footer{margin-top:16px;font-size:12px;color:#a18ca8}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}@keyframes pop{0%{transform:scale(.8) rotate(-8deg);opacity:0}70%{transform:scale(1.06) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}.paper-fly{position:absolute;top:42%;left:50%;font-size:26px;animation:pop .6s ease-out;pointer-events:none}
@media(max-height:720px){.jar-area{height:225px}.jar{transform:scale(.88)}.jar:hover{transform:scale(.88) translateY(-4px) rotate(-2deg)}}
</style></head><body>
<div class="sparkle s1">✦</div><div class="sparkle s2">🌙</div><div class="sparkle s3">♡</div><div class="sparkle s4">✨</div>
<main><h1>Hũ lời nhắn 🌷</h1><p class="sub">Một chút dịu dàng dành cho những ngày bình thường.</p>
<div class="jar-area"><div class="jar" id="jar" role="button" tabindex="0" aria-label="Bấm để mở hũ lời nhắn" onclick="showNote()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showNote()}"><div class="lid"></div><div class="jar-label">một chút vui<br>mỗi ngày ♡</div><div class="paper-stack"><span></span><span></span><span></span></div></div></div>
<div class="controls"><button id="openBtn" onclick="showNote()">Mở hũ ✨</button></div>
<div class="note-card" id="card" aria-live="polite"><div class="note-icon">💌</div><div class="note-text" id="noteText">Bấm mở hũ để nhận một lời nhắn nho nhỏ nhé.</div></div>
<div class="controls" id="moreControls" style="display:none"><button id="moreBtn" onclick="showNote()">Lấy thêm một tờ 🌸</button><button class="secondary" id="resetBtn">Để giấy lại hũ</button></div>
<p class="hint">Không cần vội. Cứ mở khi muốn nhận một lời dễ thương.</p><p class="footer">Made with a little kindness ♡</p></main>
<script>
const notes=[
"Hôm nay cố gắng nhiều rồi, nghỉ ngơi một chút nha 🌷","Mong hôm nay có một điều nhỏ xíu khiến bạn vui.","Nhớ uống nước nè, cơ thể cũng cần được chăm sóc đó 💧","Không phải ngày nào cũng cần thật tuyệt vời đâu.","Mệt thì nghỉ, không cần lúc nào cũng phải cố.","Chúc bạn gặp toàn chuyện dễ thương hôm nay 🍀","Bạn xứng đáng có những ngày bình yên.","Thử thả lỏng vai, hít một hơi chậm rồi thở ra nhé.","Một ngày không vui không có nghĩa ngày mai cũng vậy.","Chúc bạn ngủ ngon và có một giấc mơ thật êm 🌙","Đi chậm cũng được, miễn là bạn đang chăm sóc mình.","Có thể tự thưởng cho mình một món ngon nho nhỏ hôm nay 🍰","Đừng quên: bạn không cần làm mọi thứ hoàn hảo.","Gửi bạn một chiếc ôm bằng chữ: cố lên, rồi nghỉ nha ♡","Mở cửa sổ một chút, đón không khí mới nào 🌤️","Hôm nay hãy tử tế với chính mình nữa nhé.","Bạn đã đi qua nhiều ngày rồi, hôm nay cứ nhẹ nhàng thôi.","Nếu đang rối, thử làm một việc nhỏ trước nha.","Chúc một ngày có nắng, có tiếng cười và ít lo âu.","Bạn có quyền có ngày lười và ngày cần nghỉ.","Một chút âm nhạc, một chút trà, một chút bình yên 🎧","Không cần so mình với ai cả. Mỗi người có nhịp riêng.","Hy vọng bạn sẽ bắt gặp một điều đáng yêu trên đường hôm nay.","Nhớ dành vài phút làm điều bạn thích nha.","Ngày mới là một trang giấy mới, cứ viết từ từ thôi.","Bạn không cần giải quyết hết mọi chuyện trong một ngày.","Chúc bạn có một khoảnh khắc cười thật tự nhiên hôm nay 😊","Thở chậm thôi. Mọi thứ có thể đợi bạn bình tĩnh.","Tự nói với mình một câu tốt đẹp đi: ‘Mình đang cố gắng.’","Mong hôm nay lòng bạn nhẹ như mây ☁️","Nếu mỏi mắt, nhìn xa một chút và nghỉ ngơi nhé.","Hãy ăn một bữa ngon và đừng quên chăm sóc bản thân.","Bạn có thể bắt đầu lại bất cứ lúc nào, kể cả ngay bây giờ.","Một điều bé nhỏ cũng có thể làm ngày hôm nay đẹp hơn.","Chúc bạn luôn tìm được góc bình yên của riêng mình.","Không sao nếu hôm nay năng lượng không nhiều.","Gửi bạn một ngôi sao may mắn ⭐","Hãy bật bài hát yêu thích và tận hưởng vài phút.","Mong những điều tốt đẹp ghé qua bạn thật khẽ.","Hôm nay, chỉ cần bình an cũng đã là điều đáng quý.","Đừng quên nghỉ giải lao giữa những việc cần làm nhé.","Bạn có thể chọn điều khiến mình vui, dù thật nhỏ.","Chúc bạn có một buổi chiều dịu dàng.","Có những chuyện để mai nghĩ cũng được. Giờ nghỉ nha.","Hãy dành cho bản thân sự kiên nhẫn mà bạn dành cho người khác.","Chúc ngày hôm nay có thêm một chút màu hồng 🌸","Cười nhẹ một cái, rồi tiếp tục theo nhịp của riêng mình.","Mong bạn cảm thấy được yêu thương và trân trọng.","Bạn hãy nhớ ăn uống, ngủ nghỉ và vui chơi vừa đủ nhé.","Gấp lại chuyện hôm nay, dành chỗ cho sự bình yên.","Chúc bạn ngày mai thức dậy với tâm trạng dễ chịu hơn 💗"];
let remaining=[];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function pickNote(){if(!remaining.length)remaining=shuffle(notes.slice());return remaining.pop();}
function showNote(){
 const card=document.getElementById('card'), text=document.getElementById('noteText'), controls=document.getElementById('moreControls');
 if(!card||!text||!controls)return;
 text.textContent=pickNote();card.classList.add('show');controls.style.display='flex';
 const area=document.querySelector('.jar-area');if(area){const paper=document.createElement('div');paper.className='paper-fly';paper.textContent='💌';area.appendChild(paper);setTimeout(()=>paper.remove(),700);}
}
function resetJar(){document.getElementById('card').classList.remove('show');document.getElementById('moreControls').style.display='none';document.getElementById('noteText').textContent='Bấm mở hũ để nhận một lời nhắn nho nhỏ nhé.';remaining=[];}
document.getElementById('resetBtn').onclick=resetJar;
</script></body></html>
